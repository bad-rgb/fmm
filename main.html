<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Halaman Utama - FMM</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f7f9fc;
      color: #333;
      padding: 20px;
      text-align: center;
    }

    nav {
      margin-bottom: 20px;
    }

    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #007bff;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 20px;
    }

    button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1em;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #218838;
    }

    footer {
      margin-top: 40px;
      font-size: 0.9em;
      color: #777;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.5em;
      }

      button {
        width: 80%;
      }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Beranda</a>
    <a href="main.html">Main</a>
  </nav>

  <h1>Selamat Datang di Halaman Utama!</h1>
  <p>Ini adalah versi yang lebih interaktif dari halaman main kamu.</p>
  <button onclick="showMessage()">Klik Aku!</button>

  <footer>
    &copy; 2025 FMM Web. Dibuat oleh Tim Bad RGB.
  </footer>

  <script>
    function showMessage() {
      alert("Halo, terima kasih sudah klik tombol ini!");
    }
  </script>

</body>
</html>
